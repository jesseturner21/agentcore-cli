name: AgentCore Harness Reviewing

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'GitHub PR URL to review (e.g. https://github.com/org/repo/pull/123)'
        required: true
        type: string

permissions:
  id-token: write
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check team membership
        id: auth
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const user = context.payload.pull_request.user.login;
            const org = context.repo.owner;
            try {
              await github.rest.teams.getMembershipForUserInOrg({
                org,
                team_slug: 'agentcore-cli-devs',
                username: user,
              });
              console.log(`${user} is a member of agentcore-cli-devs`);
              core.setOutput('authorized', 'true');
            } catch (error) {
              console.log(`${user} is not a member of agentcore-cli-devs (${error.status}) — skipping review`);
              core.setOutput('authorized', 'false');
            }

      - name: Skip if not authorized
        if: github.event_name == 'pull_request' && steps.auth.outputs.authorized != 'true'
        run: |
          echo "PR author is not in agentcore-cli-devs team. Skipping AI review."
          exit 0

      - name: Determine PR URL
        if: github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true'
        id: pr-url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.pr_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ github.event.pull_request.html_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract PR number
        if: github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true'
        id: pr-number
        run: |
          PR_URL="${{ steps.pr-url.outputs.url }}"
          PR_NUM="${PR_URL##*/}"
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Add ai-reviewing label
        if: github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-number.outputs.number }}');
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'ai-reviewing',
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'ai-reviewing',
                  color: '7B61FF',
                  description: 'AI review in progress',
                });
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['ai-reviewing'],
            });

      - name: Checkout
        if: github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true'
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.HARNESS_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python 3.12
        if: github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv and dependencies
        if: github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install boto3
        if: github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true'
        run: uv pip install --system boto3

      - name: Run AI review
        if: github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true'
        env:
          PR_URL: ${{ steps.pr-url.outputs.url }}
        run: python .github/scripts/python/harness_review.py

      - name: Remove ai-reviewing label
        if: always() && (github.event_name != 'pull_request' || steps.auth.outputs.authorized == 'true')
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-number.outputs.number }}');
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'ai-reviewing',
              });
            } catch (error) {
              console.log('Label removal failed (may not exist):', error.message);
            }
